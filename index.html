 if(tab==='sembako'){const run={};const rows=C.amb.map((x,i)=>{const m=C.mm[x.n];run[x.n]=(run[x.n]||0)+x.tot;const jt=m?m.batas-(run[x.n]-m.by):null;return{...x,ck:jt===null?'Nama tidak ada':jt<0?'MELEBIHI BATAS':'OK',_i:i}}).reverse();
  h=head('Ambil Sembako','1 baris = 1 jenis barang. Merah = melebihi jatah.')+form('m',[['d','Tanggal','date'],['n','Nama Anggota','sel',names],['b','Barang','sel',srtB(C.B).map(b=>b.n)],['q','Jumlah','num']],'amb','')+`<div class="card"><div class="add"><label>Filter nama${cb('f_s',FN,fS,'','setFS')}</label></div></div><div class="card">${tbl([['Tanggal',x=>x.d],['Nama',x=>esc(x.n)],['Barang',x=>esc(x.b)],['Jml',x=>x.q,'r'],['Total',x=>rp(x.tot),'r'],['Cek',x=>badge(x.ck)]],rows.filter(x=>fS==='Semua anggota'||x.n===fS),'amb')}</div>`}
 if(tab==='utang')h=head('Catat Pembayaran Utang','Cicil atau lunas = 1 baris')+form('u',[['d','Tanggal','date'],['n','Nama Anggota','sel',names],['v','Jumlah Bayar (Rp)','num'],['c','Catatan','sel',['Cicilan','Lunas'],false,'Cicilan']],'bay','')+`<div class="card"><div class="add"><label>Filter nama${cb('f_u',FN,fU,'','setFU')}</label></div></div><div class="card">${tbl([['Tanggal',x=>x.d],['Nama',x=>esc(x.n)],['Dibayar',x=>rp(x.v),'r'],['Catatan',x=>x.c],['Sisa Utang Sekarang',x=>C.mm[x.n]?rp(C.mm[x.n].sisa):'Nama tidak ada','r']],S.bay.map((x,i)=>({...x,_i:i})).filter(x=>fU==='Semua anggota'||x.n===fU),'bay')}</div>`;
 if(tab==='barang'){const sk=S.stk.map((x,i)=>({...x,_i:i,u:(C.bb[x.b]||{}).u||''})).reverse(),BS=srtB(C.B),ly=[];
  BS.forEach(b=>{let f=1;C.LY[b.n].forEach(l=>{if(l.r>0){ly.push({n:b.n,u:b.u,...l,first:f});f=0}})});
  const cols=[['Barang',x=>esc(x.n)],['Modal (aktif)',x=>rp(x.mn),'r'],['Jual (aktif)',x=>rp(x.jn),'r']].concat(showSt?[['Stok Awal',x=>qn(x.s0)+' '+esc(x.u),'r'],['Tambah Stok',x=>qn(x.tb)+' '+esc(x.u),'r']]:[]).concat([['Terjual',x=>qn(x.o)+' '+esc(x.u),'r'],['Sisa',x=>qn(x.s)+' '+esc(x.u),'r'],['Status',x=>badge(x.st)]]);
  h=head('Barang','Tambah barang baru, atau tambah stok. Harga berbeda dicatat sebagai batch baru (FIFO).')+
  form('b',[['n','Nama Barang','text'],['u','Satuan','text'],['m','Harga Modal','num'],['j','Harga Jual','num'],['s0','Stok Awal','num',true],['min','Stok Minimum','num',true]],'brg','<b>Barang baru</b> - jika nama sudah ada dan harga berbeda, otomatis jadi batch stok baru (FIFO: stok lama terjual lebih dulu).')+
  form('t',[['d','Tanggal','date'],['b','Barang','sel',BS.map(b=>b.n)],['q','Jumlah Tambah Stok','num'],['m','Harga Modal Baru (opsional)','num',true],['j','Harga Jual Baru (opsional)','num',true]],'stk','<b>Tambah stok</b> - harga dikosongkan = pakai harga batch terakhir.')+
  `<div class="card"><div class="row"><b>Daftar Barang</b><button class="btn o" onclick="showSt=!showSt;render()">${showSt?'🙈 Sembunyikan':'👁 Tampilkan'} Stok Awal dan Tambah Stok</button></div><p class="hint">Urutan otomatis: Aman, Menipis, Habis, lalu Stok kurang. Harga aktif = harga batch yang sedang dijual.</p>${tbl(cols,BS,'brg')}</div>`+
  `<div class="card"><b>Batch Stok Tersisa (FIFO)</b><p class="hint">Dijual dari batch paling atas dulu.</p>${tbl([['Barang',x=>esc(x.n)],['Tgl Masuk',x=>x.d],['Modal',x=>rp(x.m),'r'],['Jual',x=>rp(x.j),'r'],['Sisa',x=>qn(x.r)+' '+esc(x.u),'r'],['',x=>x.first?badge('Dijual dulu'):'']],ly,'')}</div>`+
  `<div class="card"><b>Riwayat Tambah Stok</b>${tbl([['Tanggal',x=>x.d],['Barang',x=>esc(x.b)],['Jumlah',x=>qn(x.q)+' '+esc(x.u),'r'],['Modal',x=>x.m?rp(x.m):'-','r'],['Jual',x=>x.j?rp(x.j):'-','r']],sk,'stk')}</div>`}
 if(tab==='atur'){const p=S.set;const fld=(k,l,t='text')=>`<label style="display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px">${l}<input type="${t}" value="${esc(p[k])}" onchange="S.set.${k}=${t==='number'?'+this.value':'this.value'};save();render()"></label>`;
  h=head('Pengaturan','Biasanya cukup diatur sekali')+`<div class="card add">${fld('nama','Nama Koperasi')}${fld('desa','Desa / Kelurahan')}${fld('pokok','Simpanan Pokok (Rp)','number')}${fld('cicil','Maks Cicilan Pokok','number')}${fld('bulanan','Simpanan Bulanan (Rp)','number')}<label style="display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px">Batas pinjaman dari${cb('atur_dasar',DASAR,p.dasar==='Total'?DASAR[0]:DASAR[1],'','setDasar')}</label></div><button class="btn o" onclick="resetData()">Kembalikan data contoh</button>`}
 if(tab==='lap'){const L=LAP(lthn);
  h=head('Laporan Keuangan','Laba rugi, neraca, dan arus kas. Pilih tahun laporan, lalu export ke PDF.')+`<div class="card row"><b>Tahun ${lthn}</b><span><button class="btn o" onclick="lthn--;render()">◀</button> <button class="btn o" onclick="lthn++;render()">▶</button></span></div>`+
  ['lr','nr','lak'].map(k=>{const R=L[k];return`<div class="card"><div class="row"><div><b>${R.t}</b><p class="hint" style="margin:2px 0 0">${R.p}</p></div><button class="btn" onclick="pdf('${k}')">⬇ Export PDF</button></div><div class="tw"><table>${R.r.map(x=>`<tr style="${x.h?'background:var(--bg);font-weight:bold':x.b?'font-weight:bold':''}"><td style="${x.i?'padding-left:26px':''}">${x.l}</td><td class="r">${x.v==null?'':rp(x.v)}</td></tr>`).join('')}</table></div><p class="hint" style="margin:8px 0 0">${R.n}</p></div>`}).join('')}
 el.innerHTML=(tab==='dashboard'?hero(C):'')+h}
render();
</script></body></html>
